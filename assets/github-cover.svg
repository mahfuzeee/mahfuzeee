<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.6" stop-color="#111a3a"/>
      <stop offset="1" stop-color="#1b1147"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.15" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="1" r="0.5">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1500" height="500" fill="url(#bg)"/>
  <rect width="1500" height="500" fill="url(#grid)"/>
  <rect width="1500" height="500" fill="url(#glow1)"/>
  <rect width="1500" height="500" fill="url(#glow2)"/>

  <!-- code window decoration -->
  <g transform="translate(980,90)" font-family="Consolas, 'Courier New', monospace" font-size="20">
    <rect width="420" height="260" rx="14" fill="#0d1428" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="26" cy="26" r="7" fill="#ff5f57"/>
    <circle cx="50" cy="26" r="7" fill="#febc2e"/>
    <circle cx="74" cy="26" r="7" fill="#28c840"/>
    <text x="28" y="82" fill="#a78bfa">const</text>
    <text x="92" y="82" fill="#e2e8f0">dev</text>
    <text x="136" y="82" fill="#38bdf8">=</text>
    <text x="156" y="82" fill="#e2e8f0">{</text>
    <text x="52" y="116" fill="#94a3b8">stack:</text>
    <text x="126" y="116" fill="#4ade80">"MERN"</text>
    <text x="204" y="116" fill="#e2e8f0">,</text>
    <text x="52" y="150" fill="#94a3b8">framework:</text>
    <text x="172" y="150" fill="#4ade80">"Next.js"</text>
    <text x="268" y="150" fill="#e2e8f0">,</text>
    <text x="52" y="184" fill="#94a3b8">passion:</text>
    <text x="146" y="184" fill="#4ade80">"building"</text>
    <text x="28" y="218" fill="#e2e8f0">}</text>
    <rect x="46" y="224" width="10" height="20" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="90" y="150" font-size="26" fill="#94a3b8" letter-spacing="6">HELLO, I'M</text>
    <text x="90" y="235" font-size="92" font-weight="800" fill="#ffffff">Mahfuz</text>
    <rect x="90" y="258" width="220" height="6" rx="3" fill="url(#accent)"/>
    <text x="90" y="318" font-size="38" font-weight="600" fill="url(#accent)">Full-Stack Web Developer</text>
  </g>

  <!-- tech chips -->
  <g font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e2e8f0">
    <g transform="translate(90,360)">
      <rect width="140" height="44" rx="22" fill="#4ade80" fill-opacity="0.12" stroke="#4ade80" stroke-opacity="0.6"/>
      <text x="70" y="29" text-anchor="middle">MongoDB</text>
    </g>
    <g transform="translate(244,360)">
      <rect width="130" height="44" rx="22" fill="#e2e8f0" fill-opacity="0.08" stroke="#e2e8f0" stroke-opacity="0.5"/>
      <text x="65" y="29" text-anchor="middle">Express</text>
    </g>
    <g transform="translate(388,360)">
      <rect width="110" height="44" rx="22" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.6"/>
      <text x="55" y="29" text-anchor="middle">React</text>
    </g>
    <g transform="translate(512,360)">
      <rect width="120" height="44" rx="22" fill="#84cc16" fill-opacity="0.12" stroke="#84cc16" stroke-opacity="0.6"/>
      <text x="60" y="29" text-anchor="middle">Node.js</text>
    </g>
    <g transform="translate(646,360)">
      <rect width="120" height="44" rx="22" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.7"/>
      <text x="60" y="29" text-anchor="middle">Next.js</text>
    </g>
  </g>
</svg>
